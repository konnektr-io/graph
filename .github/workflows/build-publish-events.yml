name: Build and Publish Events Image to GHCR

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set VERSION variable from tag
        run: |
          TAG=${{github.event.release.tag_name}}
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Build and load
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/AgeDigitalTwins.Events/Dockerfile
          push: true
          load: true
          # Canonical image path matches the repo name (konnektr-io/graph). The legacy
          # path is kept as a second tag for one transition window so deployments pinned
          # to the old chart 0.14.x keep receiving patch releases without a chart bump.
          # TODO(graph-1.31): drop the legacy tag once no consumer pulls the old path.
          tags: |
            ghcr.io/konnektr-io/graph/graph-events:${{ env.VERSION }}
            ghcr.io/konnektr-io/pg-age-digitaltwins/agedigitaltwins-events:${{ env.VERSION }}
